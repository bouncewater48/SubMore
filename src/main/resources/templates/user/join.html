<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SubMore Join</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<form th:action="@{/user/join}" method="post">

    <div class="join-card">
        <div class="logo-section">
            <img th:src="@{/images/logo.jpg}" alt="SubMore 로고" class="logo-img">
        </div>

        <div class="join-content-section">
            <div class="input-group-row">
                <input type="text" name="loginId" class="input-field" placeholder="아이디" required>
                <button type="button" class="check-btn">중복확인</button>
            </div>

            <input type="password" name="password" class="input-field" placeholder="비밀번호" required>
            <input type="text" name="userName" class="input-field" placeholder="이름" required>
            <input type="email" name="userEmail" class="input-field" placeholder="이메일 (example@email.com)" required>

            <button type="submit" class="join-btn">회원가입 완료</button>
        </div>
    </div>

    <div class="footer-links" style="justify-content: center; margin-top: 15px;">
        이미 계정이 있으신가요? <a th:href="@{/user/login-view}">로그인</a>
    </div>

</form>

</body>
</html>
